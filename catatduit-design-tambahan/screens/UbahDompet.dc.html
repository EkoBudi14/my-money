<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ubah dompet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./catatduit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}.opt{border:1.5px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);color:var(--text)}.opt.on{border-color:var(--accent);background:var(--accent-tint)}</style>
</helmet>
<div class="app" style="height: 1000px; background: var(--surface)">
<div class="scroll" style="padding-bottom: 120px">
<div class="top">
<a href="Dompet.dc.html" class="icon-btn ghost" aria-label="Kembali"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 class="h2">Ubah dompet</h1>
<span style="width: 44px"></span>
</div>

<label class="field">Nama dompet<input class="input" type="text" value="GoPay"></label>
<div class="field">Tipe<div class="seg"><button>Bank</button><button class="on">E-wallet</button><button>Tunai</button></div></div>
<div class="field">Masuk ke
<div class="g2">
<button class="opt on"><span class="t">Saldo aktif</span><span class="meta" style="white-space: normal">Dihitung di saldo beranda</span></button>
<button class="opt"><span class="t">Tabungan inti</span><span class="meta" style="white-space: normal">Aset tersimpan</span></button>
</div>
</div>

<div class="field">Nilai saat ini
<div class="amount-box" style="border-bottom-width: 1.5px"><span class="cur">Rp</span><span class="val" style="font-size: 28px">250.000</span></div>
<span class="lbl" style="font-weight: 500">Sebelumnya Rp 210.000 · naik Rp 40.000</span>
</div>

<div class="field">Sumber dana (opsional)
<div class="input"><div class="ic-s c-bank"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"></path></svg></div><span class="grow" style="font-weight: 600">BCA</span><span class="lbl">Rp 2.380.000</span><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></div>
</div>
<div class="banner info" style="font-size: 12px; align-items: flex-start"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path></svg><span>Selisih Rp 40.000 diambil dari BCA dan dicatat sebagai transfer. Kalau nilai turun, selisihnya dikembalikan ke BCA.</span></div>

<a href="HapusDompet.dc.html" class="btn-2 btn-block" style="color: var(--danger); border-color: var(--danger-tint); margin-top: 8px"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Hapus dompet</a>
</div>
<div class="sticky-foot"><button class="btn btn-block">Simpan perubahan</button></div>
</div>

</html>
