<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tambah dompet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./catatduit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}.opt{border:1.5px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);color:var(--text)}.opt.on{border-color:var(--accent);background:var(--accent-tint)}</style>
</helmet>
<div class="app" style="height: 844px">
<div class="scroll" aria-hidden="true">
<div class="top"><h1 class="h1">Dompet</h1></div>
<div class="hero" style="height: 120px"></div>
<div class="card" style="height: 200px"></div>
</div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-labelledby="db-title" style="top: 92px">
<div class="grabber"></div>
<div class="between">
<h2 class="h2" id="db-title" style="font-size: 18px">Tambah dompet</h2>
<a href="Dompet.dc.html" class="icon-btn ghost" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<label class="field">Nama dompet<input class="input" type="text" placeholder="BCA utama"></label>

<div class="field">Tipe
<div class="seg"><button class="on">Bank</button><button>E-wallet</button><button>Tunai</button></div>
</div>

<div class="field">Masuk ke
<div class="g2">
<button class="opt on"><span class="t">Saldo aktif</span><span class="meta" style="white-space: normal">Uang harian, dihitung di beranda</span></button>
<button class="opt"><span class="t">Tabungan inti</span><span class="meta" style="white-space: normal">Aset tersimpan, bukan untuk harian</span></button>
</div>
</div>

<div class="field">Saldo saat ini
<div class="amount-box" style="border-bottom-width: 1.5px"><span class="cur">Rp</span><span class="val" style="font-size: 28px; color: var(--text-2)">0</span></div>
</div>

<div class="field">Sumber dana (opsional)
<div class="input"><span class="grow">Manual, tidak terhubung</span><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></div>
<span class="lbl" style="font-weight: 500">Kalau dipilih, saldo awal diambil dari dompet sumber dan dicatat “Isi saldo awal dari {sumber}”. Saldo sumber harus cukup.</span>
</div>

<button class="btn btn-block" style="margin-top: auto">Simpan dompet</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
