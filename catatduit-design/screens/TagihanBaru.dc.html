<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tambah tagihan rutin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./catatduit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="height: 844px">
<div class="scroll" aria-hidden="true">
<div class="top"><h1 class="h1">Tagihan rutin</h1></div>
<div class="card" style="height: 120px"></div>
</div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-labelledby="tb-title" style="top: 132px">
<div class="grabber"></div>
<div class="between">
<h2 class="h2" id="tb-title" style="font-size: 18px">{{ title }}</h2>
<a href="Tagihan.dc.html" class="icon-btn ghost" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div class="seg"><button class="{{ tabT }}" onClick="{{ setT }}">Tagihan rutin</button><button class="{{ tabP }}" onClick="{{ setP }}">Pemasukan rutin</button></div>

<label class="field">{{ nameLabel }}<input class="input" type="text" placeholder="{{ namePh }}"></label>

<div class="field">{{ amountLabel }}
<div class="amount-box" style="border-bottom-width: 1.5px"><span class="cur">Rp</span><span class="val" style="font-size: 28px; color: var(--text-2)">0</span></div>
</div>

<div class="field">Kategori
<div class="input"><span class="grow" style="font-weight: 600">{{ catDefault }}</span><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></div>
</div>

<div class="field">{{ dateLabel }}
<div class="input"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span style="color: var(--text-2)">Pilih tanggal</span></div>
<span class="lbl" style="font-weight: 500">{{ dateHelp }}</span>
</div>

<button class="btn btn-block" style="margin-top: auto">Simpan</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 't' }; }
renderVals() {
var self = this; var t = this.state.mode === 't';
return {
tabT: t ? 'on' : '', tabP: t ? '' : 'on',
setT: function () { self.setState({ mode: 't' }); },
setP: function () { self.setState({ mode: 'p' }); },
title: t ? 'Tambah tagihan rutin' : 'Tambah pemasukan rutin',
nameLabel: t ? 'Nama tagihan' : 'Nama pemasukan',
namePh: t ? 'Netflix, WiFi, listrik' : 'Gaji, uang kos dari adik',
amountLabel: t ? 'Jumlah tagihan' : 'Jumlah pemasukan',
catDefault: t ? 'Tagihan' : 'Gaji',
dateLabel: t ? 'Tanggal bayar pertama' : 'Tanggal terima pertama',
dateHelp: t ? 'Berulang tiap bulan di tanggal yang sama.' : 'Berulang tiap bulan di tanggal yang sama.'
};
}
}
</script>
</body>
</html>
