<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Buat budget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./catatduit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="height: 844px">
<div class="scroll" aria-hidden="true">
<div class="top"><h1 class="h1">Budget</h1></div>
<div class="card" style="height: 140px"></div>
</div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-labelledby="bb-title" style="top: 64px">
<div class="grabber"></div>
<div class="between">
<h2 class="h2" id="bb-title" style="font-size: 18px">Buat budget</h2>
<a href="Budget.dc.html" class="icon-btn ghost" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div class="stack" style="gap: 6px">
<div class="g2">
<div class="field">Mulai<div class="input">25 Sep 2026</div></div>
<div class="field">Selesai<div class="input">25 Okt 2026</div></div>
</div>
<span class="lbl">Default ikut periode yang sedang dipilih di halaman Budget (bulanan atau custom).</span>
</div>

<div class="field">Kategori
<div class="chips">
<button class="chip">Kebutuhan dapur</button>
<button class="chip on">Makan di luar</button>
<button class="chip">Transportasi</button>
<button class="chip">Tempat tinggal</button>
<button class="chip">Tagihan</button>
<button class="chip">Belanja</button>
<button class="chip">Kesehatan</button>
<button class="chip">Pribadi &amp; hiburan</button>
<button class="chip">Edukasi &amp; donasi</button>
<button class="chip">Lainnya</button>
</div>
</div>

<div class="field">Batas
<div class="amount-box"><span class="cur">Rp</span><span class="val" style="font-size: 30px">1.500.000</span></div>
</div>

<button class="btn btn-block" style="margin-top: auto">Simpan budget</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
